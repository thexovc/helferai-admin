<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Helfer Admin</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f9fafb; font-family: system-ui, -apple-system, sans-serif; color: #1a1a2e; padding: 16px; box-sizing: border-box; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 32px 24px; max-width: 360px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { font-size: 14px; color: #6b7280; margin: 0 0 20px; line-height: 1.5; }
  button { background: #6c9e4e; color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>The admin needs an internet connection to show live data. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
